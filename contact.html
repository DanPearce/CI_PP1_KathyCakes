    </head>
    <body class="dp-has-bar">
<dp-header logo="assets/portfolio/DANPEARCE.png?v=2"></dp-header>
        <!--Fixed Navigational Bar-->
        <nav class="nav-bar">
            <ul>
                <li id="logo"><a href="index.html" aria-label="Visit the home page">KathyCakes</a></li>
                <li><a href="recipes.html" aria-label="Visit the recipe page">Recipes</a></li>
                <li><a href="find.html" aria-label="Visit the find us page">Find Us</a></li>
                <li><a href="contact.html" aria-label="Visit the contact us page">Contact Us</a></li>
            </ul>
        </nav>
        <!--Header/Hero Image-->
        <header class="contact-header" aria-label="Freshly baked pumpkin seeded muffins in their baking tin">
                <h1>Contact Us</h1>
                <h2>Please use the form below to get in touch with any business related queries or customer orders.</h2>
        </header>
        <!--Contact Us Form Area-->
        <section class="contact-us">
            <h3>Get in touch: </h3>
            <div class="form-area">
            <form method="get" action="contact.html" class="contact-form">
                <label for="firstName">First Name</label>
                <input id="firstName" name="first_name" type="text" class="text-input-small" required>
                <label for="lastName">Last Name</label>
                <input id="lastName" name="last_name" type="text" class="text-input-small" required>
                <label for="email">Email Address</label>
                <input id="email" name="email_address" type="email" class="text-input-small" required>
                <label for="message">Message</label>
                <input id="message" name="message" type="text" class="text-input-big" required>
                <input class="submit-message" type="submit" value="Send Message!">
            </form>
            </div>
        </section>
        <!--Footer-->
        <footer>
            <a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Visit our Facebook page (opens in a new tab)"><i class="fab fa-facebook-square"></i></a>
            <a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Visit our Instagram page (opens in a new tab)"><i class="fab fa-instagram-square"></i></a>
            <a href="https://www.twitter.com/" target="_blank" rel="noopener" aria-label="Visit our Twitter page (opens in a new tab)"><i class="fab fa-twitter-square"></i></a>
            <p class="footerSignature">COPYRIGHT © KATHYCAKES 2026</p>
            <p id="footerSignature">Website by Dan Pearce<br><a href="https://danielpearce.co.uk/" target="_blank" rel="noopener" aria-label="Visit Dan Pearce's website (opens in a new tab)">danielpearce.co.uk</a></p>
        </footer>
        <!--Font Awesome-->
        <script src="https://kit.fontawesome.com/dd3efeca5d.js" crossorigin="anonymous"></script>
        <script src="assets/portfolio/portfolio-header.js?v=3" defer></script>
    </body>
</html>
